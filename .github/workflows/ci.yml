name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ssdlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dagger All (lint + test + race + security)
        uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: .
          args: all --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Coverage Report
        uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: .
          args: coverage --source=. export --path=coverage.html
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.html
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Dagger Security (govulncheck + gosec)
        uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: .
          args: security --source=. export --path=gosec-results.sarif
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

  container:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Dagger Image Build
        uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: .
          args: image --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: xoscal-server:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
