name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ssdlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dagger
        uses: dagger/dagger-for-github@v6
        with:
          install-only: true
          version: "v0.21.7"

      - name: Dagger All (lint + test + race + security)
        run: dagger call all --source=.

      - name: Coverage Report
        run: dagger call coverage --source=. export --path=coverage.html

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.html
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dagger
        uses: dagger/dagger-for-github@v6
        with:
          install-only: true
          version: "v0.21.7"

      - name: Dagger Security (govulncheck + gosec)
        run: dagger call security --source=. export --path=gosec-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-results.sarif

  container:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dagger
        uses: dagger/dagger-for-github@v6
        with:
          install-only: true
          version: "v0.21.7"

      - name: Dagger Image Build
        run: dagger call image --source=. export --path=xoscal-server.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: xoscal-server.tar
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
