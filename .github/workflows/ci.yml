name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ANALYSIS_ATTEMPT: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  ssdlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f # v7
        with:
          version: "v0.21.7"

      - name: Dagger All (lint + test + race + security)
        run: dagger call all --source=. export --path=ci-gates

      - name: Coverage Report
        run: dagger call coverage --source=. export --path=coverage.html

      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: coverage.html
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f # v7
        with:
          version: "v0.21.7"

      - name: Dagger Security (govulncheck + gosec)
        run: dagger call security --source=. export --path=gosec-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        if: always()
        with:
          sarif_file: gosec-results.sarif

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup pinned Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f
        with:
          version: "v0.21.7"
      - name: Retain raw frontend analysis through Dagger
        run: dagger call with-analysis-attempt --attempt="$ANALYSIS_ATTEMPT" frontend-analysis-reports export --path=frontend-analysis > frontend-export.log 2>&1
      - name: Produce and validate exact served site through Dagger
        run: dagger call with-analysis-attempt --attempt="$ANALYSIS_ATTEMPT" site --source=. export --path=site-preview
      - name: Preserve frontend evidence and producer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-analysis
          path: |
            frontend-analysis/
            frontend-export.log
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f # v7
        with:
          version: "v0.21.7"

      - name: Collect exact local image findings through Dagger
        run: |
          dagger call image --source=. export --path=xoscal-server.tar
          dagger call with-analysis-attempt --attempt="$ANALYSIS_ATTEMPT" image-analysis-reports --archive=xoscal-server.tar export --path=image-analysis
      - name: Enforce image CI threshold through Dagger
        run: dagger call with-analysis-attempt --attempt="$ANALYSIS_ATTEMPT" image-analysis-ci --source=. --archive=xoscal-server.tar export --path=admitted-image-analysis
      - name: Retain raw image analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-analysis
          path: image-analysis/
          if-no-files-found: error
