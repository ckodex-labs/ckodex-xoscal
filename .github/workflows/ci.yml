name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ssdlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f # v7
        with:
          install-only: true
          version: "v0.21.7"

      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Dagger All (lint + test + race + security)
        run: dagger call all --source=.

      - name: Coverage Report
        run: dagger call coverage --source=. export --path=coverage.html

      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: coverage.html
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f # v7
        with:
          install-only: true
          version: "v0.21.7"

      - name: Dagger Security (govulncheck + gosec)
        run: dagger call security --source=. export --path=gosec-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        if: always()
        with:
          sarif_file: gosec-results.sarif

  container:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f # v7
        with:
          install-only: true
          version: "v0.21.7"

      - name: Dagger Image Build
        run: dagger call image --source=. export --path=xoscal-server.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: xoscal-server.tar
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  verify-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get latest release tag
        id: latest
        run: echo "tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if no release
        if: steps.latest.outputs.tag == ''
        run: echo "No releases found, skipping verification."

      - name: Install cosign + slsa-verifier
        if: steps.latest.outputs.tag != ''
        run: |
          set -eu
          curl -fsSL "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.0/slsa-verifier-linux-amd64" -o /usr/local/bin/slsa-verifier
          printf '%s  %s\n' "499befb675efcca9001afe6e5156891b91e71f9c07ab120a8943979f85cc82e6" /usr/local/bin/slsa-verifier | sha256sum -c -
          chmod +x /usr/local/bin/slsa-verifier
          slsa-verifier version

      - name: Install Cosign
        if: steps.latest.outputs.tag != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        if: steps.latest.outputs.tag != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature (cosign)
        if: steps.latest.outputs.tag != ''
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/ckodex-labs/ckodex-xoscal/.github/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/ckodex-labs/ckodex-xoscal:${{ steps.latest.outputs.tag }}

      - name: Verify SLSA provenance (slsa-verifier)
        if: steps.latest.outputs.tag != ''
        run: |
          tag="${{ steps.latest.outputs.tag }}"
          gh release download "$tag" --pattern "provenance.intoto.jsonl" --dir /tmp
          gh release download "$tag" --pattern "*.tar.gz" --dir /tmp
          for archive in /tmp/ckodex-xoscal_*.tar.gz; do
            echo "Verifying: $archive"
            slsa-verifier verify-artifact "$archive" \
              --provenance-path /tmp/provenance.intoto.jsonl \
              --source-uri github.com/ckodex-labs/ckodex-xoscal
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
