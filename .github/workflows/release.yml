name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_ATTEMPT: gha-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_WORKSPACE: /tmp/xoscal-release-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f
        with:
          version: "v0.21.7"
      - name: Produce and admit complete candidate
        run: |
          mkdir -p "$RELEASE_WORKSPACE"
          dagger call with-version --version="$RELEASE_TAG" with-analysis-attempt --attempt="$ANALYSIS_ATTEMPT" release-candidate \
            --source=. --release-tag="$RELEASE_TAG" --source-revision="$SOURCE_REVISION" \
            export --path="$RELEASE_WORKSPACE/candidate"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
      - name: Attest payload manifest with existing hosted identity
        id: payload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ env.RELEASE_WORKSPACE }}/candidate/payload-manifest.json
      - name: Verify payload and render final site in Dagger
        run: |
          dagger call finalize-candidate --source=. --candidate="$RELEASE_WORKSPACE/candidate" \
            --payload-bundle="$PAYLOAD_BUNDLE" --release-tag="$RELEASE_TAG" \
            --source-revision="$SOURCE_REVISION" export --path="$RELEASE_WORKSPACE/final"
          dagger call package-candidate --source=. --candidate="$RELEASE_WORKSPACE/final" \
            export --path="$RELEASE_WORKSPACE/release-site.tar.gz"
        env:
          PAYLOAD_BUNDLE: ${{ steps.payload.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
      - name: Attest frozen final manifest, transport and OCI root bytes
        id: final
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ env.RELEASE_WORKSPACE }}/final/release-manifest.json
            ${{ env.RELEASE_WORKSPACE }}/release-site.tar.gz
            ${{ env.RELEASE_WORKSPACE }}/final/release/image-index.json
      - name: Verify exact final bytes and stage attachment view
        run: |
          dagger call verify-candidate --source=. --candidate="$RELEASE_WORKSPACE/final" \
            --release-bundle="$RELEASE_BUNDLE" --release-tag="$RELEASE_TAG" \
            --source-revision="$SOURCE_REVISION" export --path="$RELEASE_WORKSPACE/verified"
          dagger call promotion-assets --source=. --candidate="$RELEASE_WORKSPACE/final" \
            --release-bundle="$RELEASE_BUNDLE" --release-tag="$RELEASE_TAG" \
            --source-revision="$SOURCE_REVISION" export --path="$RELEASE_WORKSPACE/attachments"
          cp "$RELEASE_WORKSPACE/release-site.tar.gz" "$RELEASE_WORKSPACE/attachments/"
          dagger call verify-transport --source=. --transport="$RELEASE_WORKSPACE/attachments/release-site.tar.gz" \
            --bundle="$RELEASE_BUNDLE" --release-tag="$RELEASE_TAG" --source-revision="$SOURCE_REVISION" \
            export --path="$RELEASE_WORKSPACE/transport-verification.json"
        env:
          RELEASE_BUNDLE: ${{ steps.final.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
      - name: Stage verified assets without public release or registry tags
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release
          path: |
            ${{ env.RELEASE_WORKSPACE }}/attachments/
            ${{ env.RELEASE_WORKSPACE }}/verified/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve raw findings when candidate gate fails
        if: failure()
        run: |
          status=0
          mkdir -p "$RELEASE_WORKSPACE/failed-analysis/logs"
          # Preserve the original produced bytes before any independent rerun.
          if [ -d "$RELEASE_WORKSPACE/candidate" ]; then
            cp -a "$RELEASE_WORKSPACE/candidate" "$RELEASE_WORKSPACE/failed-analysis/produced-candidate"
          fi
          if [ -f "$PAYLOAD_BUNDLE" ]; then
            cp "$PAYLOAD_BUNDLE" "$RELEASE_WORKSPACE/failed-analysis/payload.sigstore.json"
          fi
          printf 'subject\treport_mode\texport_status\n' > "$RELEASE_WORKSPACE/failed-analysis/exports.tsv"
          collect() {
            subject="$1"
            mode="$2"
            result=0
            dagger call with-version --version="$RELEASE_TAG" with-analysis-attempt --attempt="$ANALYSIS_ATTEMPT" candidate-subject-reports \
              --source=. --release-tag="$RELEASE_TAG" --source-revision="$SOURCE_REVISION" \
              --subject="$subject" --report-mode="$mode" \
              export --path="$RELEASE_WORKSPACE/failed-analysis/$subject/$mode" \
              > "$RELEASE_WORKSPACE/failed-analysis/logs/$subject-$mode.log" 2>&1 || result=$?
            printf '%s\t%s\t%s\n' "$subject" "$mode" "$result" >> "$RELEASE_WORKSPACE/failed-analysis/exports.tsv"
            if [ "$result" -ne 0 ]; then
              status=1
              printf 'Diagnostic export failed: %s/%s (exit %s); see retained log\n' "$subject" "$mode" "$result" >&2
            fi
          }
          collect source vulnerabilities
          collect frameworks constraints
          for subject in sdk-go sdk-python sdk-java sdk-csharp sdk-ts sdk-swift \
            archive-linux_amd64 archive-linux_arm64 archive-darwin_amd64 archive-darwin_arm64 \
            image-amd64 image-arm64 binary frontend; do
            for mode in vulnerabilities sbom-raw sbom-assessment; do
              collect "$subject" "$mode"
            done
          done
          exit "$status"
        env:
          PAYLOAD_BUNDLE: ${{ steps.payload.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
      - name: Retain failed raw evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failed-release-analysis
          path: ${{ env.RELEASE_WORKSPACE }}/failed-analysis/
          if-no-files-found: warn

  promote:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: staged
      - name: Setup pinned Dagger
        uses: dagger/dagger-for-github@057a749131c864e4a719e6773baf0d1447ef998f
        with:
          version: "v0.21.7"
      - name: Reverify promotion subjects after staging transfer
        run: |
          dagger call verify-candidate --source=. --candidate=staged/verified \
            --release-bundle=staged/attachments/release-manifest.sigstore.json \
            --release-tag="$RELEASE_TAG" --source-revision="$SOURCE_REVISION" \
            export --path=admitted
          dagger call verify-transport --source=. --transport=staged/attachments/release-site.tar.gz \
            --bundle=staged/attachments/release-manifest.sigstore.json --release-tag="$RELEASE_TAG" \
            --source-revision="$SOURCE_REVISION" export --path=transport-verification.json
          dagger call promotion-assets --source=. --candidate=admitted \
            --release-bundle=admitted/proofs/release-manifest.sigstore.json \
            --release-tag="$RELEASE_TAG" --source-revision="$SOURCE_REVISION" \
            export --path=promoted-attachments
          cp staged/attachments/release-site.tar.gz promoted-attachments/
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
      - name: Log in to existing registry promotion boundary
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse overwriting any consumer release identity
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          python3 scripts/promotion-preflight.py --tag "$RELEASE_TAG" --revision "$SOURCE_REVISION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
      - name: Promote previously scanned and manifest-covered OCI bytes
        run: |
          skopeo copy --all --preserve-digests oci-archive:admitted/release/image.tar "docker://ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG"
          skopeo inspect --raw "docker://ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG" > promoted-index.json
          cmp admitted/release/image-index.json promoted-index.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish verified attachments without overwriting existing release
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft promoted-attachments/* \
            --title "$RELEASE_TAG" --notes "Source: $SOURCE_REVISION. Signed manifests bind exact artifacts and final portal bytes. See the retained verification envelope."
          gh release edit "$RELEASE_TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}

      # Preserve admitted Pages bytes. The protected Pages environment accepts
      # main; publication with GITHUB_TOKEN does not trigger a second workflow.
      - name: Stage admitted Pages bytes
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: admitted

  pages-handoff:
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Identify the protected main-ref Pages deployment
        run: |
          printf 'Pages deployment is pending a separately authorized main-ref Pages run.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Release: `%s`; expected source: `%s`.\n' "$RELEASE_TAG" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Run `gh workflow run pages.yml --ref main -f release_tag=%s -f source_revision=%s`, then require both verification and deployment to succeed.\n' "$RELEASE_TAG" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
