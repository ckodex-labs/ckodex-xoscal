  /v1/transparency/evidence/fetch:
    post:
      tags:
        - oscal.services.v1.TransparencyExchangeService
      summary: FetchExternalEvidence
      description: |-
        FetchExternalEvidence retrieves an external artifact over HTTPS under the
         deployment's bounded fetch policy, stores it as content-addressed
         evidence, and records an append-only fetch audit event. The RPC fails
         closed when no fetch policy is configured or the request violates it.
      operationId: oscal.services.v1.TransparencyExchangeService.FetchExternalEvidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/oscal.services.v1.FetchExternalEvidenceRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oscal.services.v1.FetchExternalEvidenceResponse'
  /v1/transparency/evidence/fetch/events:
    get:
      tags:
        - oscal.services.v1.TransparencyExchangeService
      summary: ListFetchEvents
      operationId: oscal.services.v1.TransparencyExchangeService.ListFetchEvents
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            title: page_size
            format: int32
        - name: pageToken
          in: query
          schema:
            type: string
            title: page_token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oscal.services.v1.ListFetchEventsResponse'
  /v1/transparency/evidence/{evidenceId}:
    get:
      tags:
