            schema:
              type: object
              properties:
                checks:
                  type: array
                  items:
                    type: string
                  title: checks
                  description: 'empty = run all: digest, signature, policy'
              title: VerifyClaimRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oscal.services.v1.VerifyClaimResponse'
  /v1/transparency/evidence:
    post:
