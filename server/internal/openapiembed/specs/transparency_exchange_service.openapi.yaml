          title: stored
        audit:
          title: audit
          $ref: '#/components/schemas/oscal.services.v1.EvidenceFetchAudit'
      title: FetchExternalEvidenceResponse
      additionalProperties: false
    oscal.services.v1.GetClaimRequest:
      type: object
      properties:
        claimId:
          type: string
          title: claim_id
      title: GetClaimRequest
      additionalProperties: false
    oscal.services.v1.GetClaimResponse:
      type: object
      properties:
        claim:
          title: claim
          $ref: '#/components/schemas/oscal.services.v1.Claim'
      title: GetClaimResponse
      additionalProperties: false
    oscal.services.v1.GetEvidenceRequest:
      type: object
      properties:
        evidenceId:
          type: string
          title: evidence_id
      title: GetEvidenceRequest
      additionalProperties: false
    oscal.services.v1.GetEvidenceResponse:
      type: object
      properties:
        evidence:
          title: evidence
          $ref: '#/components/schemas/oscal.services.v1.Evidence'
      title: GetEvidenceResponse
      additionalProperties: false
    oscal.services.v1.Identity:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: workload | human | organization | tool
        id:
          type: string
          title: id
        keyJson:
          type: string
          title: key_json
          description: JSON blob for key metadata
      title: Identity
      additionalProperties: false
    oscal.services.v1.ImportBatchRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/oscal.services.v1.ImportRecord'
          title: records
        allOrNothing:
          type: boolean
          title: all_or_nothing
      title: ImportBatchRequest
      additionalProperties: false
    oscal.services.v1.ImportBatchResponse:
