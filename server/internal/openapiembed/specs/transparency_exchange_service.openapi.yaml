         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    oscal.services.v1.Claim:
      type: object
      allOf:
        - properties:
            id:
              type: string
              title: id
            type:
              type: string
              title: type
            subject:
              title: subject
              $ref: '#/components/schemas/oscal.services.v1.Reference'
            predicate:
              title: predicate
              $ref: '#/components/schemas/oscal.services.v1.Predicate'
            issuer:
              title: issuer
              $ref: '#/components/schemas/oscal.services.v1.Identity'
            bomKind:
              type: string
              title: bom_kind
            validTime:
              title: valid_time
              $ref: '#/components/schemas/oscal.services.v1.TimeWindow'
            observedTime:
              title: observed_time
              $ref: '#/components/schemas/google.protobuf.Timestamp'
            sourceRefs:
              type: array
              items:
                $ref: '#/components/schemas/oscal.services.v1.EvidenceRef'
              title: source_refs
            proofRefs:
              type: array
              items:
                $ref: '#/components/schemas/oscal.services.v1.ProofRef'
              title: proof_refs
            policyRefs:
              type: array
              items:
                $ref: '#/components/schemas/oscal.services.v1.PolicyRef'
              title: policy_refs
            extensionsJson:
              type: string
              title: extensions_json
              description: JSON blob for flexible extensions
            trustState:
              type: string
              title: trust_state
              description: candidate | incomplete | verified | rejected
            proofStateJson:
              type: string
              title: proof_state_json
              description: current persisted proof projection
        - oneOf:
            - type: object
              properties:
                nullObject:
                  title: null_object
                  $ref: '#/components/schemas/google.protobuf.Timestamp'
              title: null_object
              required:
                - nullObject
            - type: object
              properties:
                object:
                  title: object
                  $ref: '#/components/schemas/oscal.services.v1.Reference'
              title: object
              required:
                - object
      title: Claim
      additionalProperties: false
    oscal.services.v1.CreateClaimRequest:
      type: object
      properties:
        claim:
          title: claim
          $ref: '#/components/schemas/oscal.services.v1.Claim'
      title: CreateClaimRequest
      additionalProperties: false
    oscal.services.v1.CreateClaimResponse:
      type: object
      properties:
        claim:
          title: claim
          $ref: '#/components/schemas/oscal.services.v1.Claim'
        trustState:
          type: string
          title: trust_state
          description: computed initial state
      title: CreateClaimResponse
      additionalProperties: false
    oscal.services.v1.Evidence:
      type: object
      properties:
        id:
          type: string
          title: id
        mediaType:
          type: string
          title: media_type
        bomKind:
          type: string
          title: bom_kind
        digest:
          type: string
          title: digest
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
        storage:
          title: storage
          $ref: '#/components/schemas/oscal.services.v1.Storage'
        producedByJson:
          type: string
          title: produced_by_json
          description: JSON blob
        subjectRefs:
          type: array
          items:
            $ref: '#/components/schemas/oscal.services.v1.Reference'
          title: subject_refs
        predicateType:
          type: string
          title: predicate_type
        specJson:
          type: string
          title: spec_json
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        validTime:
          title: valid_time
          $ref: '#/components/schemas/oscal.services.v1.TimeWindow'
        supersedes:
          type: array
          items:
            type: string
          title: supersedes
        integrityMethodsJson:
          type: string
          title: integrity_methods_json
        classification:
          type: string
          title: classification
          description: public | internal | confidential | restricted
        extensionsJson:
          type: string
          title: extensions_json
      title: Evidence
      additionalProperties: false
    oscal.services.v1.EvidenceFetchAudit:
      type: object
      properties:
        url:
          type: string
          title: url
        digest:
          type: string
          title: digest
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
        outcome:
          type: string
          title: outcome
          description: fetched | policy_denied | fetch_failed
        detail:
          type: string
          title: detail
        fetchedAt:
          title: fetched_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        durationMs:
          type:
            - integer
            - string
          title: duration_ms
          format: int64
      title: EvidenceFetchAudit
      additionalProperties: false
    oscal.services.v1.EvidenceRef:
      type: object
      properties:
        ref:
          type: string
          title: ref
        digest:
          type: string
          title: digest
        mediaType:
          type: string
          title: media_type
        bomKind:
          type: string
          title: bom_kind
      title: EvidenceRef
      additionalProperties: false
    oscal.services.v1.ExportClaimReceiptRequest:
      type: object
      properties:
        claimId:
          type: string
          title: claim_id
      title: ExportClaimReceiptRequest
      additionalProperties: false
    oscal.services.v1.ExportClaimReceiptResponse:
      type: object
      properties:
        claimId:
          type: string
          title: claim_id
        receiptJson:
          type: string
          title: receipt_json
        receiptDigest:
          type: string
          title: receipt_digest
        trustState:
          type: string
          title: trust_state
        verificationEventHash:
          type: string
          title: verification_event_hash
        exportedAt:
          title: exported_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ExportClaimReceiptResponse
      additionalProperties: false
