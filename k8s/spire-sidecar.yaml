apiVersion: v1
kind: ServiceAccount
metadata:
  name: xoscal-server
  namespace: oscal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xoscal-server
  namespace: oscal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: xoscal-server
  template:
    metadata:
      labels:
        app: xoscal-server
    spec:
      serviceAccountName: xoscal-server
      
      # SPIRE Agent socket from host
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets/agent.sock
            type: Socket
        - name: spire-helper-secrets
          emptyDir:
            medium: Memory
      
      containers:
        # OSCAL gRPC Server
        - name: xoscal-server
          image: xoscal-server:latest
          ports:
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: spire-auth-config
          env:
            - name: ANTHROPIC_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/anthropic.com/token
            - name: ANTHROPIC_FEDERATION_RULE_ID
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: federation_rule_id
            - name: ANTHROPIC_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: organization_id
            - name: ANTHROPIC_SERVICE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: service_account_id
            - name: ANTHROPIC_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: workspace_id
          volumeMounts:
            - name: spire-helper-secrets
              mountPath: /var/run/secrets/anthropic.com
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; channel = grpc.insecure_channel('localhost:50051'); print('OK')"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; channel = grpc.insecure_channel('localhost:50051'); print('OK')"
            initialDelaySeconds: 5
            periodSeconds: 5
        
        # SPIRE Helper Sidecar
        - name: spire-helper
          image: ghcr.io/spiffe/spiffe-helper:v1.7.0
          args:
            - -config
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets/agent.sock
            - name: spire-helper-secrets
              mountPath: /var/run/secrets/anthropic.com
          envFrom:
            - configMapRef:
                name: spire-helper-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-helper-config
  namespace: oscal
data:
  helper.conf: |
    agent_address = "/run/spire/sockets/agent.sock"
    cert_dir      = "/var/run/secrets/anthropic.com"
    daemon_mode   = true

    jwt_svids = [{
        jwt_audience       = "https://api.anthropic.com"
        jwt_svid_file_name = "token"
    }]
---
apiVersion: v1
kind: Service
metadata:
  name: xoscal-server
  namespace: oscal
spec:
  selector:
    app: xoscal-server
  ports:
    - port: 50051
      targetPort: 50051
  type: ClusterIP
