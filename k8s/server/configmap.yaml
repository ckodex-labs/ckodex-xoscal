apiVersion: v1
kind: ConfigMap
metadata:
  name: xoscal-server-config
data:
  config.yaml: |
    server:
      addr: ":50051"
      max_recv_msg_size_mb: 4
      max_send_msg_size_mb: 4
      max_concurrent_streams: 1000
      keepalive_time: "2m"
      keepalive_timeout: "20s"
      enable_reflection: false
      enable_pprof: false
      shutdown_timeout: "30s"
      tls_cert_path: ""
      tls_key_path: ""
      tls_client_ca_path: ""
    store:
      dsn: "/data/oscal.db"
      max_open_conn: 10
      max_idle_conn: 2
      conn_max_lifetime: "1h"
    observability:
      metrics_enabled: true
      metrics_addr: ":9090"
      tracing_enabled: false
      log_level: "info"
      log_format: "json"
    security:
      rate_limit_rps: 100
      rate_limit_burst: 200
      auth_mode: "none"
