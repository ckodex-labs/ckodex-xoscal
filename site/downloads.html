<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xOSCAL — Downloads</title><link rel="stylesheet" href="ds3.css"></head>
<body><header><h1>Downloads</h1>
<nav><a href="portal.html">Portal</a><a href="docs.html">API Docs</a>
<a href="transparency.html">Transparency</a><a href="sbom-validation.html">SBOM Validation</a><a href="index.html">Home</a></nav></header>
<main>
<h2>Release — Binaries &amp; Container</h2>
<p>Release artifacts published via goreleaser with SLSA L3 provenance and cosign-signed container image.
All archives include per-archive SBOMs. <strong>These are signed and downloadable.</strong></p>
<div id="release"></div>

<h2>SDK Clients</h2><div id="sdks"></div>
<h2>OSCAL Frameworks</h2><div id="frameworks"></div>
</main>
<script>
// Fallback data (used if release-assets.json fetch fails)
const FALLBACK_URL = "https://github.com/ckodex-labs/ckodex-xoscal/releases/download/v0.1.0";
const FALLBACK = [
  {name:"ckodex-xoscal_0.1.0_Linux_x86_64.tar.gz", url:FALLBACK_URL+"/ckodex-xoscal_0.1.0_Linux_x86_64.tar.gz", size:0, digest:""},
  {name:"ckodex-xoscal_0.1.0_Linux_arm64.tar.gz", url:FALLBACK_URL+"/ckodex-xoscal_0.1.0_Linux_arm64.tar.gz", size:0, digest:""},
  {name:"ckodex-xoscal_0.1.0_Darwin_x86_64.tar.gz", url:FALLBACK_URL+"/ckodex-xoscal_0.1.0_Darwin_x86_64.tar.gz", size:0, digest:""},
  {name:"ckodex-xoscal_0.1.0_Darwin_arm64.tar.gz", url:FALLBACK_URL+"/ckodex-xoscal_0.1.0_Darwin_arm64.tar.gz", size:0, digest:""},
  {name:"checksums.txt", url:FALLBACK_URL+"/checksums.txt", size:0, digest:""},
  {name:"provenance.intoto.jsonl", url:FALLBACK_URL+"/provenance.intoto.jsonl", size:0, digest:""},
  {name:"sbom-assessment-results.json", url:FALLBACK_URL+"/sbom-assessment-results.json", size:0, digest:""}
];
function fmtSize(b){if(!b)return"";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";return(b/1048576).toFixed(1)+" MB"}
const relRow = x => `<div class="ck-quiet"><a href="${x.url}" rel="noopener">${x.name}</a>
  <div class="ck-desc">${fmtSize(x.size)} · ${x.digest || "see checksums.txt"}</div></div>`;

// Try to fetch release-assets.json (generated at build time by Dagger).
// Falls back to hardcoded data if the fetch fails.
fetch("./release-assets.json").then(r=>r.ok?r.json():Promise.reject()).then(assets=>{
  // Add container image (not a GitHub release asset)
  assets.push({name:"ghcr.io/ckodex-labs/ckodex-xoscal (latest)", url:"https://github.com/ckodex-labs/ckodex-xoscal/pkgs/container/ckodex-xoscal", size:0, digest:"cosign keyless (OIDC)"});
  document.getElementById("release").innerHTML = assets.map(relRow).join("");
}).catch(()=>{
  document.getElementById("release").innerHTML = FALLBACK.map(relRow).join("");
});

fetch("./downloads.json").then(r=>r.json()).then(d=>{
  const row = x => `<div class="ck-quiet"><a href="${x.path}">${x.name}</a>
    <div class="ck-hash">${x.digest}</div></div>`;
  document.getElementById("sdks").innerHTML = d.sdks.map(row).join("");
  document.getElementById("frameworks").innerHTML = d.frameworks.map(row).join("");
});
</script></body></html>
