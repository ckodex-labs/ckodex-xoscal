<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xOSCAL — SBOM Validation</title><link rel="stylesheet" href="ds3.css">
<style>
#results { white-space: pre-wrap; font-family: "JetBrains Mono",monospace; font-size: 13px;
  border: 1px solid var(--ck-fg-3); padding: 16px; background: var(--ck-surface); overflow-x: auto; }
.summary { display: flex; gap: 24px; margin: 16px 0; flex-wrap: wrap; }
.stat { border: 1px solid var(--ck-fg-3); padding: 12px 20px; background: var(--ck-surface); }
.stat .num { font-size: 28px; font-family: "Instrument Serif",Georgia,serif; color: var(--ck-accent); }
.stat .lbl { font-size: 12px; color: var(--ck-fg-3); text-transform: uppercase; letter-spacing: 0.05em; }
.pass { color: #2D7A3E; } .fail { color: var(--ck-accent); }
</style></head>
<body><header><h1>SBOM Validation</h1>
<nav><a href="portal.html">Portal</a><a href="docs.html">API Docs</a>
<a href="transparency.html">Transparency</a><a href="downloads.html">Downloads</a>
<a href="index.html">Home</a></nav></header>
<main>
<div class="ck-quiet">
SBOM validated with <a href="https://github.com/sbom-tool/sbom-tools">sbom-tools</a>
against the <strong>NTIA Minimum Elements</strong> standard. Findings exported as
OSCAL 1.1.2 <code>assessment-results</code> via the
<a href="https://github.com/sbom-tool/sbom-tools/pull/280">oscal-json output format</a>.
</div>
<div id="summary" class="summary"></div>
<h2>OSCAL Assessment Results</h2>
<div id="results">Loading…</div>
<p><a href="sbom-assessment-results.json">Download raw JSON</a></p>
</main>
<script>
fetch("./sbom-assessment-results.json").then(r=>r.json()).then(doc=>{
  const ar = doc["assessment-results"] || doc;
  const results = ar.results || [];
  const findings = results.flatMap(r => r.findings || []);
  const observations = results.flatMap(r => r.observations || []);
  const passCount = findings.filter(f => {
    const s = f.target?.status?.state || "";
    return s === "satisfied";
  }).length;
  const failCount = findings.length - passCount;

  document.getElementById("summary").innerHTML =
    `<div class="stat"><div class="num pass">${passCount}</div><div class="lbl">Satisfied</div></div>` +
    `<div class="stat"><div class="num fail">${failCount}</div><div class="lbl">Not Satisfied</div></div>` +
    `<div class="stat"><div class="num">${observations.length}</div><div class="lbl">Observations</div></div>` +
    `<div class="stat"><div class="num">${findings.length}</div><div class="lbl">Total Findings</div></div>`;

  document.getElementById("results").textContent = JSON.stringify(doc, null, 2);
}).catch(e => {
  document.getElementById("results").textContent = "Failed to load: " + e;
});
</script></body></html>
