         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    oscal.services.v1.Claim:
      type: object
      allOf:
        - properties:
            id:
              type: string
              title: id
            type:
              type: string
              title: type
            subject:
              title: subject
              $ref: '#/components/schemas/oscal.services.v1.Reference'
            predicate:
              title: predicate
              $ref: '#/components/schemas/oscal.services.v1.Predicate'
            issuer:
              title: issuer
              $ref: '#/components/schemas/oscal.services.v1.Identity'
            bomKind:
              type: string
              title: bom_kind
            validTime:
              title: valid_time
              $ref: '#/components/schemas/oscal.services.v1.TimeWindow'
            observedTime:
              title: observed_time
              $ref: '#/components/schemas/google.protobuf.Timestamp'
            sourceRefs:
              type: array
              items:
                $ref: '#/components/schemas/oscal.services.v1.EvidenceRef'
              title: source_refs
            proofRefs:
              type: array
              items:
                $ref: '#/components/schemas/oscal.services.v1.ProofRef'
              title: proof_refs
            policyRefs:
              type: array
              items:
                $ref: '#/components/schemas/oscal.services.v1.PolicyRef'
              title: policy_refs
            extensionsJson:
              type: string
              title: extensions_json
              description: JSON blob for flexible extensions
        - oneOf:
            - type: object
              properties:
                nullObject:
                  title: null_object
                  $ref: '#/components/schemas/google.protobuf.Timestamp'
              title: null_object
              required:
                - nullObject
            - type: object
              properties:
                object:
                  title: object
                  $ref: '#/components/schemas/oscal.services.v1.Reference'
              title: object
              required:
                - object
      title: Claim
      additionalProperties: false
    oscal.services.v1.CreateClaimRequest:
      type: object
      properties:
        claim:
          title: claim
          $ref: '#/components/schemas/oscal.services.v1.Claim'
      title: CreateClaimRequest
      additionalProperties: false
    oscal.services.v1.CreateClaimResponse:
      type: object
      properties:
        claim:
          title: claim
          $ref: '#/components/schemas/oscal.services.v1.Claim'
        trustState:
          type: string
          title: trust_state
          description: computed initial state
      title: CreateClaimResponse
      additionalProperties: false
    oscal.services.v1.Evidence:
      type: object
      properties:
        id:
          type: string
          title: id
        mediaType:
          type: string
          title: media_type
        bomKind:
          type: string
          title: bom_kind
        digest:
          type: string
          title: digest
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
        storage:
          title: storage
          $ref: '#/components/schemas/oscal.services.v1.Storage'
        producedByJson:
          type: string
          title: produced_by_json
          description: JSON blob
        subjectRefs:
          type: array
          items:
            $ref: '#/components/schemas/oscal.services.v1.Reference'
          title: subject_refs
        predicateType:
          type: string
          title: predicate_type
        specJson:
          type: string
          title: spec_json
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        validTime:
          title: valid_time
          $ref: '#/components/schemas/oscal.services.v1.TimeWindow'
        supersedes:
          type: array
          items:
            type: string
          title: supersedes
        integrityMethodsJson:
          type: string
          title: integrity_methods_json
        classification:
          type: string
          title: classification
          description: public | internal | confidential | restricted
        extensionsJson:
          type: string
          title: extensions_json
      title: Evidence
      additionalProperties: false
    oscal.services.v1.EvidenceRef:
      type: object
      properties:
        ref:
          type: string
          title: ref
        digest:
          type: string
          title: digest
        mediaType:
          type: string
          title: media_type
        bomKind:
          type: string
          title: bom_kind
      title: EvidenceRef
      additionalProperties: false
    oscal.services.v1.GetClaimRequest:
      type: object
      properties:
        claimId:
          type: string
          title: claim_id
      title: GetClaimRequest
      additionalProperties: false
    oscal.services.v1.GetClaimResponse:
      type: object
      properties:
        claim:
          title: claim
          $ref: '#/components/schemas/oscal.services.v1.Claim'
      title: GetClaimResponse
      additionalProperties: false
    oscal.services.v1.GetEvidenceRequest:
      type: object
      properties:
        evidenceId:
          type: string
          title: evidence_id
      title: GetEvidenceRequest
      additionalProperties: false
    oscal.services.v1.GetEvidenceResponse:
      type: object
      properties:
        evidence:
          title: evidence
          $ref: '#/components/schemas/oscal.services.v1.Evidence'
      title: GetEvidenceResponse
      additionalProperties: false
    oscal.services.v1.Identity:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: workload | human | organization | tool
        id:
          type: string
          title: id
        keyJson:
          type: string
          title: key_json
          description: JSON blob for key metadata
