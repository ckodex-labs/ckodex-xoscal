    oscal.services.v1.ProofState:
      type: object
      properties:
        discovery:
          type: string
          title: discovery
          description: candidate | discovered
        graph:
          type: string
          title: graph
          description: unresolved | graph_resolved
        claim:
          type: string
          title: claim
          description: unbound | claim_bound
        source:
          type: string
          title: source
          description: unbound | source_bound | rejected
        signature:
          type: string
          title: signature
          description: unverified | signature_verified | invalid
        transparency:
          type: string
          title: transparency
          description: unverified | inclusion_verified | missing | invalid
        witnessJson:
          type: string
          title: witness_json
          description: JSON blob for WitnessSubState
        state:
          type: string
          title: state
          description: unverified | current_state_verified | superseded
        policy:
          type: string
          title: policy
          description: unevaluated | policy_admissible | policy_inadmissible | stale_policy
      title: ProofState
      additionalProperties: false
    oscal.services.v1.Reference:
      type: object
      properties:
        kind:
          type: string
          title: kind
        id:
          type: string
          title: id
        digest:
          type: string
          title: digest
        purl:
