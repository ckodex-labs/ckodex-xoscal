    get:
      tags:
        - oscal.services.v1.TransparencyGraphService
      summary: ListEdges
      operationId: oscal.services.v1.TransparencyGraphService.ListEdges
      parameters:
        - name: fromNode
          in: query
          schema:
            type: string
            title: from_node
        - name: toNode
          in: query
          schema:
            type: string
            title: to_node
