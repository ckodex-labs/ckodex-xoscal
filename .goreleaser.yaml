version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: xoscal-server
    main: ./server/cmd/xoscal-server
    binary: xoscal-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: xoscal
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
  - id: binary
    artifacts: binary
    documents:
      - "{{ .ArtifactName }}.sbom.json"

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.cert"
    args:
      - sign-blob
      - --yes
      - --output-certificate
      - "${certificate}"
      - --output-signature
      - "${signature}"
      - "${artifact}"
    artifacts: all
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: ckodex-labs
    name: ckodex-xoscal
  draft: false
  prerelease: auto
