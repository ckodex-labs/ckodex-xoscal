# OSCAL upstream reconciliation lock.
#
# Records WHAT we last reconciled the hand-authored protos against. The
# scheduled reconcile loop (.github/workflows/oscal-reconcile.yml) computes
# drift as: feed.latest != lock.current. This file is the anchor; recipes/
# declare where to look. Bumped only via a reviewed reconcile PR (DAL 3,
# never auto-merged).
#
# Classification note (CKODEX §1 rigor):
#   oscal_metaschema_version below is an ASSUMPTION baseline, not a verified
#   reconcile result. It is set to v1.2.2 because the protos already include
#   mapping/v1 (the Control Mapping Model, introduced upstream in v1.2.0),
#   so the protos demonstrably target the 1.2.x line. The FIRST reconcile run
#   will either confirm parity with v1.2.2 or emit a drift report. Until then,
#   treat parity as unverified.
version: "1.0"
sources:
  oscal:
    repo: usnistgov/OSCAL
    # Bare semver (no "v" prefix) — the canonical comparable form the poller
    # extracts from the feed. The "v" tag is reconstructed for URLs by recipes.
    # Latest verified release at pin time (2026-06-21, via releases feed): 1.2.2 (2026-04-30).
    oscal_metaschema_version: "1.2.2"
    source_commit: ""        # filled by reconcile run when a verified diff is taken
    schema_sha256: ""        # sha256 of the upstream JSON schema bundle at that version
    reconciled_at: ""        # ISO-8601; empty = never reconciled, baseline only
    parity: unverified       # unverified | verified | drift
  ciso_assistant:
    repo: intuitem/ciso-assistant-community
    branch: main
    # Framework libraries feed data/frameworks/manifest.yaml. Tracked by commit
    # on the default branch (manifest pulls from main, so this drifts often).
    # Baseline pinned 2026-06-21 to the then-current main HEAD. This is a
    # BASELINE PIN (accept current as the starting point), not a content diff —
    # parity stays unverified until a reconcile run actually compares framework
    # content. It suppresses the day-one drift PR; the next upstream commit fires one.
    source_commit: "b205141a202e10b1c0df1c5bc27d28724e36046e"
    reconciled_at: "2026-06-21T00:00:00Z"
    parity: unverified
